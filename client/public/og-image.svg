<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1a2e" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ff" />
      <stop offset="100%" stop-color="#f0f" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#0ff" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="630" x2="1200" y2="0"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>

  <!-- Logo hexagon (centered, larger) -->
  <g transform="translate(540, 140)">
    <polygon
      points="60,6 114,33 114,87 60,114 6,87 6,33"
      fill="none"
      stroke="url(#logoGradient)"
      stroke-width="3"
      opacity="0.8"
    />
    <polygon
      points="60,24 90,42 90,78 60,96 30,78 30,42"
      fill="url(#logoGradient)"
      opacity="0.2"
    />
    <circle cx="60" cy="60" r="12" fill="url(#logoGradient)" />
    <line x1="60" y1="48" x2="60" y2="24" stroke="url(#logoGradient)" stroke-width="2" />
    <line x1="70.5" y1="66" x2="90" y2="78" stroke="url(#logoGradient)" stroke-width="2" />
    <line x1="49.5" y1="66" x2="30" y2="78" stroke="url(#logoGradient)" stroke-width="2" />
  </g>

  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold">
    <tspan fill="#0ff">NASH</tspan><tspan fill="#f0f">SATOSHI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="monospace" font-size="24" fill="#888" letter-spacing="8">
    GAME THEORY AI
  </text>

  <!-- Tagline -->
  <text x="600" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#aaa">
    Crypto Game Theory Rankings
  </text>

  <!-- 4-LLM badge -->
  <text x="600" y="540" text-anchor="middle" font-family="monospace" font-size="18" fill="#666">
    Powered by 4-LLM Consensus Engine
  </text>

  <!-- Border frame -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.3" rx="10"/>
</svg>
