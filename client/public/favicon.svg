<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ff" />
      <stop offset="100%" stop-color="#f0f" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="40" height="40" fill="#0a0a0f"/>
  <!-- Outer hexagon -->
  <polygon
    points="20,2 36,11 36,29 20,38 4,29 4,11"
    fill="none"
    stroke="url(#logoGradient)"
    stroke-width="1.5"
    opacity="0.8"
  />
  <!-- Inner hexagon -->
  <polygon
    points="20,8 30,14 30,26 20,32 10,26 10,14"
    fill="url(#logoGradient)"
    opacity="0.2"
  />
  <!-- Center circuit node -->
  <circle cx="20" cy="20" r="4" fill="url(#logoGradient)" />
  <!-- Circuit lines -->
  <line x1="20" y1="16" x2="20" y2="8" stroke="url(#logoGradient)" stroke-width="1" />
  <line x1="23.5" y1="22" x2="30" y2="26" stroke="url(#logoGradient)" stroke-width="1" />
  <line x1="16.5" y1="22" x2="10" y2="26" stroke="url(#logoGradient)" stroke-width="1" />
</svg>
